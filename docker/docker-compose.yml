version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: styfla_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-styfla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-styfla_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-styfla_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - styfla_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-styfla} -d ${POSTGRES_DB:-styfla_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: styfla_app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-styfla}:${POSTGRES_PASSWORD:-styfla_password_2026}@postgres:5432/${POSTGRES_DB:-styfla_db}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-styfla2026admin}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-super_secret_session_key_styfla_2026_prod}
      NODE_ENV: production
      PORT: 3030
    ports:
      - '80:3030'
      - '3030:3030'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - styfla_net

volumes:
  postgres_data:

networks:
  styfla_net:
    driver: bridge
