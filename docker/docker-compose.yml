services:
  postgres:
    image: postgres:16-alpine
    container_name: styfla_postgres
    restart: always
    environment:
      POSTGRES_USER: styfla
      POSTGRES_PASSWORD: styfla_password_2026
      POSTGRES_DB: styfla_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styfla -d styfla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
